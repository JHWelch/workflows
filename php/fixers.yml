name: Laravel Code Linting
on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lintingSuite:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'workflows')
    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: forge
          MYSQL_DATABASE: forge
          DB_HOST: 127.0.0.1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      redis:
        image: redis
        ports:
          - 6379/tcp
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy ENV Laravel Configuration for CI
        run: php -r "file_exists('.env') || copy('.env.ci', '.env');"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Build Node and Javascript
        run: |
          npm ci
          npm run prod
        env:
          PINTURA_NPM_TOKEN: ${{ secrets.PINTURA_NPM_TOKEN }}

      - name: Generate key
        run: php artisan key:generate

      - name: Migrate MySQL DB
        env:
          DB_USER: root
          DB_PASSWORD: forge
        run: php artisan migrate:fresh

      - name: Rector Action
        run: composer rector

      - name: Run IDE Helper Generate
        env:
          DB_USER: root
          DB_PASSWORD: forge
          BROADCAST_DRIVER: pusher
          CACHE_DRIVER: redis
          QUEUE_CONNECTION: redis
          SESSION_DRIVER: redis
        run: composer run ide-helper

      - name: Laravel Pint
        run: composer fix

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ github.head_ref }}
          branch: "formatting-updates-pr-${{ github.run_number }}"
          commit-message: Automated coding standard style updates
          reviewers: ${{ github.event.pull_request.user.login }}
          title: "Formatting Updates: ${{ github.event.pull_request.title }} (#${{ github.event.number }})"
          labels: auto-branch
          body: |
            This is an auto-generated PR with code style fixes for the following PR: ${{ github.event.pull_request.html_url }}
            Feel free to improve upon what the automated tools have already done. Feel free to disagree with their choices as well https://github.com/rectorphp/rector/blob/main/docs/rector_rules_overview.md.

      - name: Fail workflow if Pull Request created
        if: steps.cpr.outputs.pull-request-number
        run: |
          echo "The following PR was opened with formatting changes: ${{ steps.cpr.outputs.pull-request-url }}"
          exit 1
